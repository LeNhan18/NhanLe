<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fireworks</title>
    <style>
        body {
            overflow: hidden;
            margin: 0;
            background: #000814;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 14px;
            z-index: 100;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>
    <div id="info">Click để bắn pháo hoa! 🎆</div>
    
    <script type="module">
        import * as THREE from "https://cdn.skypack.dev/three@0.136.0";
        import { OrbitControls } from "https://cdn.skypack.dev/three@0.136.0/examples/jsm/controls/OrbitControls";

        let scene = new THREE.Scene();
        scene.background = new THREE.Color('#000814');
        
        let camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 35);
        
        let renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(innerWidth, innerHeight);
        document.body.appendChild(renderer.domElement);
        
        window.addEventListener("resize", () => {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        });

        let controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        class Firework {
            constructor(x, z, color, type) {
                this.particles = [];
                this.exploded = false;
                this.dead = false;
                this.launchHeight = Math.random() * 8 + 10;
                this.startPos = new THREE.Vector3(x, 0, z);
                this.currentPos = this.startPos.clone();
                this.velocity = new THREE.Vector3(0, Math.random() * 0.3 + 0.4, 0);
                this.gravity = -0.008;
                this.color = color || new THREE.Color().setHSL(Math.random(), 1, 0.6);
                this.trail = [];
                this.time = 0;
                this.type = type || Math.floor(Math.random() * 5);
                
                this.createRocket();
            }

            createRocket() {
                const geometry = new THREE.BufferGeometry();
                const positions = [0, 0, 0];
                geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
                
                const material = new THREE.PointsMaterial({
                    size: 0.3,
                    color: this.color,
                    transparent: true,
                    blending: THREE.AdditiveBlending
                });
                
                this.rocket = new THREE.Points(geometry, material);
                this.rocket.position.copy(this.startPos);
                scene.add(this.rocket);
            }

            explode() {
                if (this.exploded) return;
                this.exploded = true;
                scene.remove(this.rocket);
                
                const particleCount = Math.floor(Math.random() * 200) + 150;
                const positions = [];
                const velocities = [];
                const colors = [];
                const sizes = [];
                const lifetimes = [];
                
                for (let i = 0; i < particleCount; i++) {
                    positions.push(this.currentPos.x, this.currentPos.y, this.currentPos.z);
                    
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(Math.random() * 2 - 1);
                    const speed = Math.random() * 0.3 + 0.1;
                    
                    velocities.push(
                        Math.sin(phi) * Math.cos(theta) * speed,
                        Math.sin(phi) * Math.sin(theta) * speed,
                        Math.cos(phi) * speed
                    );
                    
                    const hue = this.color.getHSL({}).h;
                    const particleColor = new THREE.Color().setHSL(
                        hue + (Math.random() - 0.5) * 0.1,
                        1,
                        0.5 + Math.random() * 0.3
                    );
                    colors.push(particleColor.r, particleColor.g, particleColor.b);
                    
                    sizes.push(Math.random() * 0.5 + 0.3);
                    lifetimes.push(Math.random() * 2 + 1);
                }
                
                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
                geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
                geometry.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));
                
                const material = new THREE.PointsMaterial({
                    size: 0.2,
                    transparent: true,
                    vertexColors: true,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false
                });
                
                this.particles = new THREE.Points(geometry, material);
                this.particleVelocities = velocities;
                this.particleLifetimes = lifetimes;
                this.particleAges = new Array(particleCount).fill(0);
                
                scene.add(this.particles);
            }

            update(delta) {
                this.time += delta;
                
                if (!this.exploded) {
                    this.velocity.y += this.gravity;
                    this.currentPos.add(this.velocity);
                    this.rocket.position.copy(this.currentPos);
                    
                    if (this.currentPos.y >= this.launchHeight) {
                        this.explode();
                    }
                } else {
                    const positions = this.particles.geometry.attributes.position.array;
                    const count = positions.length / 3;
                    let allDead = true;
                    
                    for (let i = 0; i < count; i++) {
                        this.particleAges[i] += delta;
                        
                        if (this.particleAges[i] < this.particleLifetimes[i]) {
                            allDead = false;
                            
                            const idx = i * 3;
                            positions[idx] += this.particleVelocities[idx] * delta * 60;
                            positions[idx + 1] += this.particleVelocities[idx + 1] * delta * 60 - 0.5 * 0.008 * delta * 60;
                            positions[idx + 2] += this.particleVelocities[idx + 2] * delta * 60;
                            
                            this.particleVelocities[idx + 1] -= 0.008 * delta * 60;
                        }
                    }
                    
                    this.particles.geometry.attributes.position.needsUpdate = true;
                    
                    const age = this.time - 1;
                    const maxAge = Math.max(...this.particleLifetimes);
                    this.particles.material.opacity = Math.max(0, 1 - (age / maxAge));
                    
                    if (allDead || this.particles.material.opacity <= 0) {
                        this.dead = true;
                        scene.remove(this.particles);
                    }
                }
            }
        }

        let fireworks = [];
        let clock = new THREE.Clock();

        function launchFirework(x, z) {
            const colors = [
                new THREE.Color('#ff0080'),
                new THREE.Color('#00ff80'),
                new THREE.Color('#8000ff'),
                new THREE.Color('#ffff00'),
                new THREE.Color('#00ffff'),
                new THREE.Color('#ff4040'),
                new THREE.Color('#40ff40'),
            ];
            const color = colors[Math.floor(Math.random() * colors.length)];
            fireworks.push(new Firework(x, z, color));
        }

        // Auto launch
        setInterval(() => {
            const x = (Math.random() - 0.5) * 20;
            const z = (Math.random() - 0.5) * 15;
            launchFirework(x, z);
        }, 800);

        // Click to launch
        renderer.domElement.addEventListener('click', (event) => {
            const x = (event.clientX / innerWidth - 0.5) * 25;
            const z = (event.clientY / innerHeight - 0.5) * -20;
            launchFirework(x, z);
        });

        // Animation loop
        renderer.setAnimationLoop(() => {
            const delta = clock.getDelta();
            controls.update();
            
            for (let i = fireworks.length - 1; i >= 0; i--) {
                fireworks[i].update(delta);
                if (fireworks[i].dead) {
                    fireworks.splice(i, 1);
                }
            }
            
            renderer.render(scene, camera);
        });

        // Launch initial fireworks
        setTimeout(() => launchFirework(0, 0), 500);
        setTimeout(() => launchFirework(-10, -5), 1000);
        setTimeout(() => launchFirework(10, 5), 1500);
    </script>
</body>
</html>
